<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>myCoinHistory</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --border: #d0d7de;
      --muted: #57606a;
      --bg-soft: #f6f8fa;
      --pos: #1a7f37;
      --neg: #cf222e;
      --bid: #0969da;
      --ask: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --border: #30363d;
        --muted: #8b949e;
        --bg-soft: #161b22;
        --pos: #3fb950;
        --neg: #f85149;
        --bid: #58a6ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      margin: 0; padding: 24px;
      max-width: 1280px; margin-left: auto; margin-right: auto;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
    .status { color: var(--muted); font-size: 13px; }

    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card {
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-soft);
    }
    .card .label { font-size: 12px; color: var(--muted); }
    .card .value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .pos { color: var(--pos); }
    .neg { color: var(--neg); }

    .panel {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }
    .chart-wrap { height: 360px; position: relative; }
    .chart-wrap.tall { height: 420px; }

    /* 캘린더 히트맵 */
    .heatmap {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 6px;
      overflow-x: auto;
    }
    .hm-days {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      gap: 2px;
      font-size: 10px;
      color: var(--muted);
      align-items: center;
    }
    .hm-grid {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(7, 14px);
      gap: 2px;
    }
    .hm-cell {
      width: 14px; height: 14px;
      border-radius: 3px;
      background: var(--bg-soft);
      border: 1px solid transparent;
    }
    .hm-cell.l1 { background: #c6e3ff; }
    .hm-cell.l2 { background: #79b8ff; }
    .hm-cell.l3 { background: #2188ff; }
    .hm-cell.l4 { background: #044289; }
    @media (prefers-color-scheme: dark) {
      .hm-cell.l1 { background: #0d3a6e; }
      .hm-cell.l2 { background: #1f6feb; }
      .hm-cell.l3 { background: #58a6ff; }
      .hm-cell.l4 { background: #79c0ff; }
    }
    .hm-legend { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); margin-top: 8px; }

    /* 타임라인 */
    .timeline {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
      max-height: 560px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .tl-card {
      border: 1px solid var(--border);
      border-left: 3px solid var(--bid);
      border-radius: 6px;
      padding: 10px 12px;
      background: var(--bg-soft);
      font-size: 13px;
    }
    .tl-card.ask { border-left-color: var(--ask); }
    .tl-time { font-size: 11px; color: var(--muted); }
    .tl-row { display: flex; justify-content: space-between; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .tl-side {
      font-weight: 700;
      font-size: 12px;
      padding: 1px 6px;
      border-radius: 3px;
      color: white;
      background: var(--bid);
    }
    .tl-card.ask .tl-side { background: var(--ask); }

    /* 보유 테이블 */
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child { text-align: left; }
    th { background: var(--bg-soft); font-weight: 600; color: var(--muted); }

    button { padding: 6px 12px; border: 1px solid var(--border); background: var(--bg-soft); border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { opacity: 0.85; }
    button.active { background: var(--bid); color: white; border-color: var(--bid); }
    .toolbar { display: flex; gap: 8px; align-items: center; }

    .filters {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: grid;
      gap: 12px;
    }
    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .filter-row .label { font-size: 12px; color: var(--muted); width: 60px; flex-shrink: 0; font-weight: 600; }
    .filter-row input[type="date"] {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-soft);
      font-size: 13px;
      color: inherit;
      font-family: inherit;
    }
    .chip {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    .chip.active { background: var(--bid); color: white; border-color: var(--bid); }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>myCoinHistory</h1>
      <div class="status" id="status">로딩...</div>
    </div>
    <div class="toolbar">
      <button id="reload" style="display:none;">캐시로 다시</button>
      <button id="refetch" style="display:none;">업비트에서 새로</button>
    </div>
  </div>

  <div class="filters" id="filters" style="display:none;">
    <div class="filter-row">
      <span class="label">기간</span>
      <button class="chip period" data-period="all">전체</button>
      <button class="chip period" data-period="ytd">YTD</button>
      <button class="chip period" data-period="1y">1년</button>
      <button class="chip period" data-period="3m">3개월</button>
      <button class="chip period" data-period="1m">1개월</button>
      <input type="date" id="date-start" />
      <span style="color:var(--muted)">~</span>
      <input type="date" id="date-end" />
    </div>
    <div class="filter-row">
      <span class="label">코인</span>
      <button class="chip market-all active" data-market="">전체</button>
      <span id="market-chips" style="display: contents;"></span>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="panel">
    <h2>누적 실현 손익 + 일자별 손익</h2>
    <div class="chart-wrap tall"><canvas id="chartCum"></canvas></div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <h2>코인별 보유 비중 (현재 평가액)</h2>
      <div class="chart-wrap"><canvas id="chartDoughnut"></canvas></div>
    </div>
    <div class="panel">
      <h2>코인별 누적 손익 (실현 + 미실현)</h2>
      <div class="chart-wrap"><canvas id="chartBar"></canvas></div>
    </div>
  </div>

  <div class="panel">
    <h2>거래별 손익 분포 (매도 거래만)</h2>
    <div class="chart-wrap"><canvas id="chartHist"></canvas></div>
  </div>

  <div class="panel">
    <h2>거래 빈도 (최근 1년)</h2>
    <div id="heatmap"></div>
    <div class="hm-legend">
      <span>적음</span>
      <span class="hm-cell"></span>
      <span class="hm-cell l1"></span>
      <span class="hm-cell l2"></span>
      <span class="hm-cell l3"></span>
      <span class="hm-cell l4"></span>
      <span>많음</span>
    </div>
  </div>

  <div class="panel">
    <h2>최근 매매 흐름</h2>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="panel">
    <h2>현재 보유</h2>
    <table id="positions">
      <thead>
        <tr><th>코인</th><th>수량</th><th>평단가</th><th>현재가</th><th>평가액</th><th>미실현 손익</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
const fmt = (n) => n == null ? "-" : Math.round(n).toLocaleString("ko-KR");
const fmtNum = (n, d=4) => n == null ? "-" : Number(n).toLocaleString("ko-KR", { maximumFractionDigits: d });
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const charts = {};

// 클라이언트 사이드 상태
const STATE = {
  events: [],          // 시뮬레이션 결과 (각 거래 + 그 시점 realized)
  positions: {},       // 전체 기간 누적 보유
  currentPrices: {},   // market -> 현재가
  meta: { mock: false, source: "static" },
  filter: { start: null, end: null, markets: new Set() },
};

async function fetchData(useCache) {
  try {
    const r = await fetch("./result.json", { cache: "no-store" });
    if (r.ok) return { data: await r.json(), source: "static" };
  } catch (_) {}
  const resp = await fetch(`/api/pnl?cache=${useCache ? 1 : 0}`);
  const d = await resp.json();
  if (!resp.ok) throw new Error(d.error || resp.statusText);
  return { data: d, source: "api" };
}

// 시간순 시뮬레이션: 평단/실현 정확히 계산 (backend/pnl.py의 calc_pnl 미러)
function simulate(orders) {
  const positions = {};
  const events = [];
  for (const o of orders) {
    if (!o.market.startsWith("KRW-")) continue;
    if (!positions[o.market]) positions[o.market] = { volume: 0, cost: 0 };
    const p = positions[o.market];
    let realized = 0;
    if (o.side === "bid") {
      p.volume += o.executed_volume;
      p.cost += o.executed_funds + o.paid_fee;
    } else if (o.side === "ask") {
      const avg = p.volume > 0 ? p.cost / p.volume : 0;
      const cost_out = avg * o.executed_volume;
      const net_in = o.executed_funds - o.paid_fee;
      realized = net_in - cost_out;
      p.volume -= o.executed_volume;
      p.cost -= cost_out;
      if (p.volume <= 1e-12) { p.volume = 0; p.cost = 0; }
    }
    events.push({ ...o, realized });
  }
  return { events, positions };
}

// 필터 적용 + 집계
function aggregate() {
  const { events, positions, currentPrices, filter } = STATE;
  const filtered = events.filter(e => {
    const date = e.created_at.slice(0, 10);
    if (filter.start && date < filter.start) return false;
    if (filter.end && date > filter.end) return false;
    if (filter.markets.size > 0 && !filter.markets.has(e.market)) return false;
    return true;
  });

  let realized_total = 0;
  const dailyR = {}, dailyT = {}, perMarket = {};
  // 매도 거래(realized != 0)만 수익/손실 통계 대상
  const wins = [], losses = [];
  // 필터된 events에 누적 손익 다시 부여 (필터 기준 누적)
  let runningCum = 0;
  const eventsWithCum = [];
  for (const e of filtered) {
    runningCum += e.realized;
    eventsWithCum.push({ ...e, cumulative: runningCum });
    const date = e.created_at.slice(0, 10);
    realized_total += e.realized;
    dailyR[date] = (dailyR[date] || 0) + e.realized;
    dailyT[date] = (dailyT[date] || 0) + 1;
    if (!perMarket[e.market]) {
      perMarket[e.market] = { market: e.market, realized: 0, trades: 0, wins: 0, losses: 0 };
    }
    const pm = perMarket[e.market];
    pm.realized += e.realized;
    pm.trades += 1;
    if (e.side === "ask") {
      if (e.realized > 0) { wins.push(e.realized); pm.wins += 1; }
      else if (e.realized < 0) { losses.push(e.realized); pm.losses += 1; }
    }
  }
  const sellCount = wins.length + losses.length;
  const winRate = sellCount > 0 ? wins.length / sellCount : 0;
  const avgWin = wins.length > 0 ? wins.reduce((a, b) => a + b, 0) / wins.length : 0;
  const avgLoss = losses.length > 0 ? losses.reduce((a, b) => a + b, 0) / losses.length : 0;
  const profitFactor = avgLoss !== 0 ? avgWin / Math.abs(avgLoss) : 0;

  // daily cumulative (필터된 거래만으로 다시 누적)
  const dates = Object.keys(dailyR).sort();
  let cum = 0;
  const daily = dates.map(d => {
    cum += dailyR[d];
    return { date: d, realized: dailyR[d], cumulative: cum };
  });
  const daily_trades = Object.entries(dailyT).map(([date, count]) => ({ date, count }));

  // 보유 포지션: 코인 필터만 적용 (현재 시점)
  const filteredPositions = [];
  let unrealized_total = 0;
  for (const [m, p] of Object.entries(positions)) {
    if (p.volume <= 0) continue;
    if (filter.markets.size > 0 && !filter.markets.has(m)) continue;
    const cur = currentPrices[m] || 0;
    const avg = p.cost / p.volume;
    const unrealized = cur ? (cur - avg) * p.volume : 0;
    unrealized_total += unrealized;
    filteredPositions.push({
      market: m, volume: p.volume, avg_price: avg, current_price: cur, unrealized,
    });
    if (perMarket[m]) {
      perMarket[m].current_value = p.volume * cur;
      perMarket[m].unrealized = unrealized;
    }
  }
  // per_market에는 있지만 보유 0인 코인도 처리
  for (const pm of Object.values(perMarket)) {
    if (pm.current_value == null) pm.current_value = 0;
    if (pm.unrealized == null) pm.unrealized = 0;
  }

  const recent = eventsWithCum.slice().reverse().slice(0, 80);

  return {
    trades_count: filtered.length,
    realized_total, unrealized_total,
    daily, daily_trades,
    per_market: Object.values(perMarket),
    positions: filteredPositions,
    recent_orders: recent,
    win_count: wins.length,
    loss_count: losses.length,
    win_rate: winRate,
    avg_win: avgWin,
    avg_loss: avgLoss,
    profit_factor: profitFactor,
    sell_realized: wins.concat(losses),
  };
}

function renderAll() {
  const agg = aggregate();
  const meta = STATE.meta;
  const tag = meta.mock ? " · MOCK 데이터" : (meta.source === "static" ? " · 정적 캐시" : "");
  document.getElementById("status").textContent =
    `거래 ${agg.trades_count}건${tag}`;
  renderSummary(agg);
  renderCumulativeChart(agg.daily);
  renderDoughnut(agg.per_market);
  renderBar(agg.per_market);
  renderHistogram(agg.sell_realized);
  renderHeatmap(agg.daily_trades);
  renderTimeline(agg.recent_orders);
  renderPositions(agg.positions);
}

function setupFilters() {
  // 코인 칩
  const allMarkets = [...new Set(STATE.events.map(e => e.market))].sort();
  const chipsHost = document.getElementById("market-chips");
  chipsHost.innerHTML = allMarkets.map(m =>
    `<button class="chip market" data-market="${m}">${m.replace("KRW-", "")}</button>`
  ).join("");

  document.querySelectorAll(".chip.market, .chip.market-all").forEach(btn => {
    btn.onclick = () => {
      const m = btn.dataset.market;
      if (m === "") {
        STATE.filter.markets.clear();
        document.querySelectorAll(".chip.market").forEach(b => b.classList.remove("active"));
        document.querySelector(".chip.market-all").classList.add("active");
      } else {
        document.querySelector(".chip.market-all").classList.remove("active");
        if (STATE.filter.markets.has(m)) {
          STATE.filter.markets.delete(m);
          btn.classList.remove("active");
        } else {
          STATE.filter.markets.add(m);
          btn.classList.add("active");
        }
        if (STATE.filter.markets.size === 0) {
          document.querySelector(".chip.market-all").classList.add("active");
        }
      }
      renderAll();
    };
  });

  // 기간 프리셋
  document.querySelectorAll(".chip.period").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".chip.period").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const today = new Date();
      const end = today.toISOString().slice(0, 10);
      let start = null;
      switch (btn.dataset.period) {
        case "all": start = null; break;
        case "ytd": start = `${today.getFullYear()}-01-01`; break;
        case "1y": { const d = new Date(today); d.setFullYear(d.getFullYear() - 1); start = d.toISOString().slice(0, 10); break; }
        case "3m": { const d = new Date(today); d.setMonth(d.getMonth() - 3); start = d.toISOString().slice(0, 10); break; }
        case "1m": { const d = new Date(today); d.setMonth(d.getMonth() - 1); start = d.toISOString().slice(0, 10); break; }
      }
      STATE.filter.start = start;
      STATE.filter.end = btn.dataset.period === "all" ? null : end;
      document.getElementById("date-start").value = start || "";
      document.getElementById("date-end").value = btn.dataset.period === "all" ? "" : end;
      renderAll();
    };
  });

  // 사용자 지정 날짜
  const onDateChange = () => {
    document.querySelectorAll(".chip.period").forEach(b => b.classList.remove("active"));
    STATE.filter.start = document.getElementById("date-start").value || null;
    STATE.filter.end = document.getElementById("date-end").value || null;
    renderAll();
  };
  document.getElementById("date-start").onchange = onDateChange;
  document.getElementById("date-end").onchange = onDateChange;

  // 기본: 전체 기간 활성
  document.querySelector('.chip.period[data-period="all"]').classList.add("active");
}

async function load(useCache) {
  const status = document.getElementById("status");
  status.textContent = useCache ? "로드 중..." : "업비트에서 가져오는 중...";
  let data, source;
  try {
    ({ data, source } = await fetchData(useCache));
  } catch (e) {
    status.textContent = "에러: " + e.message;
    return;
  }

  // 데이터 → 상태
  STATE.meta = { mock: !!data._mock, source };
  if (data.all_orders) {
    const sim = simulate(data.all_orders);
    STATE.events = sim.events;
    STATE.positions = sim.positions;
  } else {
    // fallback: api 모드에서 all_orders 없으면 recent_orders로 표시만
    STATE.events = (data.recent_orders || []).map(o => ({ ...o, realized: 0 }));
    STATE.positions = {};
    for (const p of data.positions || []) {
      STATE.positions[p.market] = { volume: p.volume, cost: p.avg_price * p.volume };
    }
  }
  STATE.currentPrices = data.current_prices || {};
  for (const p of data.positions || []) {
    if (p.current_price) STATE.currentPrices[p.market] = p.current_price;
  }

  if (source !== "static") {
    document.getElementById("reload").style.display = "";
    document.getElementById("refetch").style.display = "";
  }
  document.getElementById("filters").style.display = "";

  setupFilters();
  renderAll();
}

function renderSummary(d) {
  const total = (d.realized_total || 0) + (d.unrealized_total || 0);
  const winRatePct = (d.win_rate * 100).toFixed(1) + "%";
  const pfText = d.profit_factor > 0 ? d.profit_factor.toFixed(2) : "-";
  const wlText = `${d.win_count} / ${d.loss_count}`;
  const cards = [
    ["총 손익", total],
    ["실현 손익", d.realized_total],
    ["미실현 손익", d.unrealized_total],
    ["거래 건수", d.trades_count, "raw"],
    ["승률", winRatePct, "text", d.win_rate >= 0.5 ? "pos" : "neg"],
    ["수익/손실 거래", wlText, "text"],
    ["평균 수익", d.avg_win, "krw", "pos"],
    ["평균 손실", d.avg_loss, "krw", "neg"],
    ["손익비", pfText, "text", d.profit_factor >= 1 ? "pos" : "neg"],
  ];
  document.getElementById("summary").innerHTML = cards.map(([label, v, mode, forceCls]) => {
    let text, cls = forceCls || "";
    if (mode === "raw") {
      text = (v || 0).toLocaleString("ko-KR");
    } else if (mode === "text") {
      text = v;
    } else if (mode === "krw") {
      text = fmt(v) + " 원";
    } else {
      text = fmt(v) + " 원";
      if (!cls) cls = (v || 0) >= 0 ? "pos" : "neg";
    }
    return `<div class="card"><div class="label">${label}</div><div class="value ${cls}">${text}</div></div>`;
  }).join("");
}

function renderCumulativeChart(daily) {
  const ctx = document.getElementById("chartCum");
  if (charts.cum) charts.cum.destroy();
  const posColor = cssVar("--pos");
  const negColor = cssVar("--neg");
  charts.cum = new Chart(ctx, {
    data: {
      labels: daily.map(d => d.date),
      datasets: [
        {
          type: "bar",
          label: "일자별 손익",
          data: daily.map(d => d.realized),
          backgroundColor: daily.map(d => d.realized >= 0 ? posColor : negColor),
          yAxisID: "yBar",
          order: 2,
        },
        {
          type: "line",
          label: "누적 실현 손익",
          data: daily.map(d => d.cumulative),
          borderColor: cssVar("--bid"),
          backgroundColor: "rgba(9, 105, 218, 0.12)",
          fill: true, tension: 0.1, pointRadius: 0, borderWidth: 2,
          yAxisID: "yLine",
          order: 1,
        },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      scales: {
        yLine: { position: "left", ticks: { callback: v => Math.round(v).toLocaleString("ko-KR") }, title: { display: true, text: "누적 (원)" } },
        yBar: { position: "right", ticks: { callback: v => Math.round(v).toLocaleString("ko-KR") }, grid: { drawOnChartArea: false }, title: { display: true, text: "일자별 (원)" } },
      },
      plugins: { tooltip: { callbacks: { label: c => `${c.dataset.label}: ${Math.round(c.parsed.y).toLocaleString("ko-KR")} 원` } } }
    }
  });
}

function renderHistogram(realizedList) {
  const ctx = document.getElementById("chartHist");
  if (charts.hist) charts.hist.destroy();
  if (!realizedList || realizedList.length === 0) {
    ctx.parentElement.innerHTML = '<div style="color: var(--muted); padding: 20px;">매도 거래 없음</div>';
    return;
  }
  // 양수/음수 대칭 버킷: 분위수 기반
  const sorted = realizedList.slice().sort((a, b) => a - b);
  const absMax = Math.max(Math.abs(sorted[0]), Math.abs(sorted[sorted.length - 1]));
  const N_BUCKETS = 20;
  const bucketSize = absMax / (N_BUCKETS / 2);
  const buckets = new Array(N_BUCKETS).fill(0);
  for (const v of realizedList) {
    let idx = Math.floor((v + absMax) / bucketSize);
    if (idx < 0) idx = 0;
    if (idx >= N_BUCKETS) idx = N_BUCKETS - 1;
    buckets[idx] += 1;
  }
  const labels = buckets.map((_, i) => {
    const lo = -absMax + i * bucketSize;
    const hi = lo + bucketSize;
    const fmtCompact = (n) => {
      const a = Math.abs(n);
      if (a >= 1e8) return (n / 1e8).toFixed(1) + "억";
      if (a >= 1e4) return (n / 1e4).toFixed(0) + "만";
      return Math.round(n).toString();
    };
    return fmtCompact(lo);
  });
  charts.hist = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "거래 수",
        data: buckets,
        backgroundColor: buckets.map((_, i) => {
          const center = -absMax + (i + 0.5) * bucketSize;
          return center >= 0 ? cssVar("--pos") : cssVar("--neg");
        }),
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { title: ctx => `구간 시작: ${ctx[0].label}원`, label: c => `${c.parsed.y}건` } }
      },
      scales: {
        y: { title: { display: true, text: "거래 수" }, ticks: { stepSize: 1 } },
        x: { title: { display: true, text: "거래 손익 (원)" }, ticks: { autoSkip: true, maxRotation: 0 } }
      }
    }
  });
}

const PALETTE = ["#0969da", "#1a7f37", "#cf222e", "#bf8700", "#8250df", "#0550ae", "#3192aa", "#9a6700"];

function renderDoughnut(perMarket) {
  const held = perMarket.filter(m => m.current_value > 0);
  const ctx = document.getElementById("chartDoughnut");
  if (charts.dough) charts.dough.destroy();
  if (!held.length) {
    ctx.parentElement.innerHTML = '<div style="color: var(--muted); padding: 20px;">보유 코인 없음</div>';
    return;
  }
  charts.dough = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: held.map(m => m.market.replace("KRW-", "")),
      datasets: [{
        data: held.map(m => m.current_value),
        backgroundColor: held.map((_, i) => PALETTE[i % PALETTE.length]),
        borderWidth: 0,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: "right" },
        tooltip: { callbacks: { label: c => `${c.label}: ${Math.round(c.parsed).toLocaleString("ko-KR")} 원` } }
      }
    }
  });
}

function renderBar(perMarket) {
  const data = perMarket.map(m => ({ market: m.market.replace("KRW-", ""), pnl: (m.realized || 0) + (m.unrealized || 0) }))
    .sort((a, b) => b.pnl - a.pnl);
  const ctx = document.getElementById("chartBar");
  if (charts.bar) charts.bar.destroy();
  charts.bar = new Chart(ctx, {
    type: "bar",
    data: {
      labels: data.map(d => d.market),
      datasets: [{
        label: "누적 손익 (원)",
        data: data.map(d => d.pnl),
        backgroundColor: data.map(d => d.pnl >= 0 ? cssVar("--pos") : cssVar("--neg")),
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => Math.round(c.parsed.x).toLocaleString("ko-KR") + " 원" } } },
      scales: { x: { ticks: { callback: v => Math.round(v).toLocaleString("ko-KR") } } }
    }
  });
}

function renderHeatmap(dailyTrades) {
  const map = new Map(dailyTrades.map(d => [d.date, d.count]));
  const today = new Date();
  const start = new Date(today); start.setDate(start.getDate() - 364);
  // 시작점을 그 주의 일요일로 맞춤
  start.setDate(start.getDate() - start.getDay());

  const max = Math.max(1, ...dailyTrades.map(d => d.count));
  const lvl = (n) => {
    if (!n) return "";
    const r = n / max;
    if (r > 0.66) return "l4";
    if (r > 0.33) return "l3";
    if (r > 0.10) return "l2";
    return "l1";
  };

  const cells = [];
  const cur = new Date(start);
  while (cur <= today) {
    const key = cur.toISOString().slice(0, 10);
    const count = map.get(key) || 0;
    cells.push(`<div class="hm-cell ${lvl(count)}" title="${key}: ${count}건"></div>`);
    cur.setDate(cur.getDate() + 1);
  }

  const dayLabels = ["일", "", "화", "", "목", "", "토"];
  document.getElementById("heatmap").innerHTML = `
    <div class="heatmap">
      <div class="hm-days">${dayLabels.map(d => `<div>${d}</div>`).join("")}</div>
      <div class="hm-grid">${cells.join("")}</div>
    </div>`;
}

function signed(n) {
  if (n == null) return "-";
  const v = Math.round(n);
  return (v > 0 ? "+" : "") + v.toLocaleString("ko-KR");
}

function renderTimeline(orders) {
  const html = orders.map(o => {
    const sideKo = o.side === "bid" ? "매수" : "매도";
    const dt = new Date(o.created_at);
    const dateStr = dt.toLocaleDateString("ko-KR", { year: "2-digit", month: "2-digit", day: "2-digit" });
    const timeStr = dt.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    const market = o.market.replace("KRW-", "");
    const cls = o.side === "ask" ? "ask" : "";

    const realizedRow = o.side === "ask"
      ? `<div class="tl-row"><span style="color:var(--muted)">손익</span><span class="${o.realized >= 0 ? 'pos' : 'neg'}">${signed(o.realized)} 원</span></div>`
      : "";
    const cumRow = o.cumulative != null
      ? `<div class="tl-row"><span style="color:var(--muted)">누적</span><span class="${o.cumulative >= 0 ? 'pos' : 'neg'}">${signed(o.cumulative)} 원</span></div>`
      : "";

    return `<div class="tl-card ${cls}">
      <div class="tl-time">${dateStr} ${timeStr}</div>
      <div class="tl-row">
        <strong>${market}</strong>
        <span class="tl-side">${sideKo}</span>
      </div>
      <div class="tl-row"><span style="color:var(--muted)">수량</span><span>${fmtNum(o.executed_volume, 6)}</span></div>
      <div class="tl-row"><span style="color:var(--muted)">금액</span><span>${fmt(o.executed_funds)} 원</span></div>
      ${realizedRow}
      ${cumRow}
    </div>`;
  }).join("");
  document.getElementById("timeline").innerHTML = html || '<div style="color: var(--muted)">거래 없음</div>';
}

function renderPositions(rows) {
  const tbody = document.querySelector("#positions tbody");
  tbody.innerHTML = rows.map(r => {
    const cls = (r.unrealized || 0) >= 0 ? "pos" : "neg";
    const value = (r.volume || 0) * (r.current_price || 0);
    return `<tr>
      <td>${r.market}</td>
      <td>${fmtNum(r.volume, 8)}</td>
      <td>${fmt(r.avg_price)}</td>
      <td>${fmt(r.current_price)}</td>
      <td>${fmt(value)}</td>
      <td class="${cls}">${fmt(r.unrealized)}</td>
    </tr>`;
  }).join("");
}

document.getElementById("refetch").onclick = () => load(false);
load(true);
